<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Gamer - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <!-- CSS Local -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.png" alt="Logo Loja Gamer">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Promoções</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Console</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Jogos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="login.html">Login</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="O que deseja buscar?" aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Seção de Login -->
        <section id="section-login" class="row justify-content-center">
            <div class="col-md-6">
                <h1>Área de Login</h1>
                <form>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite seu usuário (admin)">
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" placeholder="Digite sua senha (123456)">
                    </div>
                    <input type="button" value="login" class="btn btn-primary w-100" id="bt-login" onclick="login()">
                </form>
                <div id="botao-cadastrar" class="mt-3 text-center">
                    <button type="button" class="btn btn-info w-100">Não é cadastrado ainda? Cadastre-se</button>
                </div>
            </div>
        </section>

        <!-- Seção de Cadastro (inicialmente oculta via CSS) -->
        <section id="section-cadastro" class="row justify-content-center">
            <div class="col-md-6">
                <div id="form-cadastrar">
                    <h2>Faça seu Cadastro</h2>
                    <form>
                        <div class="mb-3">
                            <label for="nome-cad" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome-cad" placeholder="Seu nome completo">
                        </div>
                        <div class="mb-3">
                            <label for="email-cad" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email-cad" placeholder="seu@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="senha-cad" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha-cad" placeholder="Crie uma senha">
                        </div>
                        <input type="button" value="Cadastrar" class="btn btn-primary w-100" id="bt-cadastrar" onclick="cadastro()">
                    </form>
                </div>
            </div>
        </section>
    </main>

    <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">↑ Voltar ao topo</button>

    <footer>
        <p>© 2026 E-commerce Gamer - SENAI UC09. Todos os direitos reservados.</p>
    </footer>

    <!-- Bootstrap JS, jQuery e Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.js" integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/jquery-script.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
