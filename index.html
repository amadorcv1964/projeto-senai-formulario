<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Gamer - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.png" alt="Logo Loja Gamer" style="height: 70px;">
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="#">Promoções</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section id="section-banners" class="my-4">
            <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active"><img src="img/banner1.PNG" class="d-block w-100" alt="Banner 1"></div>
                    <div class="carousel-item"><img src="img/banner2.PNG" class="d-block w-100" alt="Banner 2"></div>
                    <div class="carousel-item"><img src="img/banner3.PNG" class="d-block w-100" alt="Banner 3"></div>
                </div>
            </div>
        </section>

        <section id="section-vendidos" class="mb-5">
            <h2>OS MAIS VENDIDOS</h2>
            <div class="row">
                <div class="col-md-4"><img src="img/jogo1.PNG" class="img-fluid" alt="Jogo 1"></div>
                <div class="col-md-4"><img src="img/jogo2.PNG" class="img-fluid" alt="Jogo 2"></div>
                <div class="col-md-4"><img src="img/jogo3.PNG" class="img-fluid" alt="Jogo 3"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
