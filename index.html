<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Gamer - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="/projeto-senai-formulario/css/estilo.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="/projeto-senai-formulario/index.html">
                    <img src="/projeto-senai-formulario/img/logo.png" alt="Logo Loja Gamer">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="#">Promoções</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Console</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Jogos</a></li>
                        <li class="nav-item"><a class="nav-link" href="/projeto-senai-formulario/login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="section-banners" class="container my-4">
            <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active"><img src="/projeto-senai-formulario/img/banner1.png" class="d-block w-100" alt="Banner 1"></div>
                    <div class="carousel-item"><img src="/projeto-senai-formulario/img/banner2.png" class="d-block w-100" alt="Banner 2"></div>
                    <div class="carousel-item"><img src="/projeto-senai-formulario/img/banner3.png" class="d-block w-100" alt="Banner 3"></div>
                </div>
            </div>
        </section>

        <section id="section-vendidos" class="container mb-5">
            <h2>OS MAIS VENDIDOS</h2>
            <div class="card-group">
                <div class="card"><img src="/projeto-senai-formulario/img/jogo1.png" class="card-img-top" alt="Jogo 1"></div>
                <div class="card"><img src="/projeto-senai-formulario/img/jogo2.png" class="card-img-top" alt="Jogo 2"></div>
                <div class="card"><img src="/projeto-senai-formulario/img/jogo3.png" class="card-img-top" alt="Jogo 3"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/projeto-senai-formulario/js/script.js"></script>
